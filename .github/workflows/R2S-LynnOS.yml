name: R2S-LynnOS

on:
  # schedule:
  #   - cron: 00 17 * * 5 # 星期六早上 1:00 (UTC+8)
  # push:
  #   branches:
  #     - "v3"
  #   paths:
  #     - "script/**"
  #     - ".github/workflows/**"
  workflow_dispatch:
    inputs:
      branch:
        description: "分支"
        default: "master"
        type: string
        required: true
      build:
        description: "进行编译"
        default: true
        type: boolean
        required: true

jobs:
  Build:
    runs-on: "ubuntu-24.04"

    env:
      TARGET: R2S
      branch: "openwrt-24.10"
      needBuild: false
      wrtdir: "/home/runner/work/LynnOS/immortalwrt"
      CURRENT_TIME: "2025"
      TERM: xterm
      DEBIAN_FRONTEND: noninteractive # 无交互

    steps:
      - name: 环境变量
        run: |
          echo "当前目录：$PWD" # 预期 /home/runner/work/LynnOS/LynnOS

          if [ "${{ inputs.build }}" = "true" ] || [ "${{ github.event.schedule }}" ]; then
            echo "needBuild=true" >> $GITHUB_ENV
          fi

          if [ -n "${{ inputs.branch }}" ]; then
            echo "branch=${{ inputs.branch }}" >> $GITHUB_ENV
          fi

      - if: env.needBuild == 'true'
        name: 准备储存空间
        uses: easimon/maximize-build-space@master
        with:
          swap-size-mb: 1
          temp-reserve-mb: 512
          root-reserve-mb: 4608
          build-mount-path: "/home/runner/work/LynnOS"
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          remove-docker-images: "true"
      
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 准备环境
        run: |          
          echo "当前目录：$PWD"   # 预期 /home/runner/work/LynnOS/LynnOS 且包含源代码
          ls
          bash ./scripts/00_env.sh  # 不应使用sudo

      - name: 运行自定义脚本
        run: |
          cd $wrtdir
          echo "进入wrt根目录：$wrtdir"
          bash ${lynndir}/scripts/10_${{ env.TARGET }}.sh

          mv -f ${lynndir}/scripts/tools/* ${wrtdir}/
          bash remove_upx.sh
          bash convert_translation.sh
          bash create_acl_for_luci.sh
          sudo -E chmod -R 755 ./fix_permissions.sh
          bash ./fix_permissions.sh
          wait

          echo "生成完整配置"
          make defconfig -j$(($(nproc) + 1))

          if [ "${{ inputs.buildKernelMenu }}" = "true" ]; then
            echo "编译内核配置菜单"
            make kernel_oldconfig -j$(($(nproc) + 1))
          fi

          echo "压缩最终提交配置"
          ls
          tar -cf - . | zstd -16 -T0 -o ../immortalwrt-End.tar.zst
          sudo df -h

      - name: 上传最终提交配置
        uses: actions/upload-artifact@main
        with:
          name: immortalwrt-End
          compression-level: 0
          path: /home/runner/work/LynnOS/immortalwrt-End.tar.zst

      - if: env.needBuild == 'true'
        name: 配置缓存
        uses: HiGarfield/cachewrtbuild@main
        with:
          ccache: true
          toolchain: true
          skip: true
          mixkey: "${{ env.TARGET }}"
          prefix: "${{ env.wrtdir }}"

      - if: env.needBuild == 'true'
        name: 编译 LynnOS
        id: build
        continue-on-error: true
        run: |
          cd $wrtdir

          rm -rf /home/runner/work/LynnOS/immortalwrt-End.tar.zst &

          echo "下载所需文件"
          make download -j16

          echo "开始编译"
          make -j$(($(nproc) + 1))


      - if: steps.build.outcome == 'failure'
        name: 详细输出编译
        run: |
          cd $wrtdir
          
          echo "开始详细输出编译"
          make -j1 V=sc


      - if: steps.build.outcome == 'success'
        name: 编译完成，准备上传
        run: |
          cd ${wrtdir}/bin/targets/rockchip/armv8/

          tar -cf - ./packages --remove-files | zstd -16 -T0 -o ./packages.tar.zst
          cd .. 

          #当前目录：${wrtdir}/bin/targets/rockchip/
          tar -cf - ./armv8 | zstd -16 -T0 -o ./output.tar.zst
          cp -rf ./output.tar.zst ./armv8

          echo "CURRENT_TIME=$(date +"%Y%m%d%H%M%S")" >> $GITHUB_ENV

          df -h

      #
      # 存在的文件：
      #   ├── LynnOS/
      #   ├── immortalwrt/
      #   ├── immortalwrt/bin/targets/rockchip/armv8/packages.tar.zst （ 需要上传！）
      #   ├── immortalwrt/bin/targets/rockchip/armv8/output.tar.zst （ 需要上传！）
      #

      - if: steps.build.outcome == 'success'
        name: 上传至 artifact
        uses: actions/upload-artifact@main
        with:
          name: output.zip
          compression-level: 0
          path: |
            /home/runner/work/LynnOS/immortalwrt/bin/targets/rockchip/armv8/output.tar.zst

      - if: steps.build.outcome == 'success'
        name: 创建发行版
        continue-on-error: true
        uses: ncipollo/release-action@main
        with:
          name: LynnOS-${{ env.TARGET }}-${{ env.CURRENT_TIME }}
          allowUpdates: true
          replacesArtifacts: true
          artifactErrorsFailBuild: false
          commit: main
          tag: "${{ env.TARGET }}-${{ env.CURRENT_TIME }}"
          body: "${{ env.CURRENT_TIME }} 自动发布 LynnOS-${{ env.TARGET }}"
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: /home/runner/work/LynnOS/immortalwrt/bin/targets/rockchip/armv8/*

  Clean:
    if: ${{ always() }}
    needs: Build
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: igorjs/gh-actions-clean-workflow@v6
        with:
          runs_older_than: 0
          runs_to_keep: 5
