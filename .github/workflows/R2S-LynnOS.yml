name: R2S-LynnOS

on:
  # schedule:
  #   - cron: 00 17 * * 5 # 星期六早上 1:00 (UTC+8)
  # push:
  #   branches:
  #     - "main"
  #   paths:
  #     - "script/**"
  #     - ".github/workflows/**"
  workflow_dispatch:
    inputs:
      branch:
        description: "分支"
        default: "openwrt-24.10"
        type: string
        required: true
      build:
        description: "进行编译"
        default: true
        type: boolean
        required: true
      buildKernelMenu:
        description: "编译内核配置菜单、检查内核配置完整性"
        default: false
        type: boolean
        required: true
      # ignoreError:
      #   description: "忽略编译错误"
      #   default: false
      #   type: boolean
      #   required: true

jobs:
  Build:
    runs-on: "ubuntu-24.04"

    env:
      TARGET: R2S
      
      # branch: "openwrt-24" # TODO
      # CURRENT_TIME: "2024"
      # needBuild: false

      TERM: xterm
      DEBIAN_FRONTEND: noninteractive # 无交互

    steps:
      - name: 环境变量
        run: |
          if [ "${{ inputs.build }}" = "true" ] || [ "${{ github.event.schedule }}" ]; then
            echo "needBuild=true" >> $GITHUB_ENV
          else
            echo "needBuild=false" >> $GITHUB_ENV
          fi

          if [ -n "${{ inputs.branch }}" ]; then
            echo "branch=${{ inputs.branch }}" >> $GITHUB_ENV
          fi

      - if: env.needBuild == 'true'
        name: 最大化储存空间
        uses: AdityaGarg8/remove-unwanted-software@master
        with:
          # swap-size-mb: 1
          # temp-reserve-mb: 1024
          # root-reserve-mb: 5120
          # build-mount-path: "/home/runner/work/LynnOS" #todo 
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          remove-docker-images: "true"
          remove-large-packages: "true"
          remove-cached-tools: "true"
          remove-swapfile: "true"
          verbose: "true"

      - name: 准备环境
        run: |
          pwd  # /home/runner/work/LynnOS
          git clone -q --depth 1 --single-branch https://github.com/NuoFang6/LynnOS.git ./lynnos
          pushd lynnos
          echo "lynndir=\"$PWD\"">> $GITHUB_ENV
          popd
          echo $lynndir
          sudo -E bash ./lynnos/scriptss/00_env.sh
      #
      # WORKSPACE存在的文件：
      #   ├── lynnos/
      #   ├── immortalwrt/
      #

      - name: 运行自定义脚本
        run: |

          bash 10_${{ env.TARGET }}.sh
          bash 20_create_acl_for_luci.sh -a
          wait

          echo "合并配置"
          make defconfig -j$(($(nproc) + 1))

          if [ "${{ inputs.buildKernelMenu }}" = "true" ]; then
            echo "编译内核配置菜单"
            make kernel_oldconfig -j$(($(nproc) + 1))
          fi

          # echo "添加强制配置"
          # echo -e "\nCONFIG_MOLD=y\nCONFIG_USE_MOLD=y" >>./.config
          if [ "${{ inputs.ignoreError }}" = "true" ]; then
            echo -e '\nCONFIG_TARGET_OPTIONS=y\nCONFIG_TARGET_OPTIMIZATION="-O0 -pipe -mcpu=generic"' >>./.config
          fi

          echo "压缩最终提交配置"
          rm -rf ./2305packages
          rm -rf ./masterimmortalwrt
          rm -rf ./lede
          tar -C ../immortalwrt -cf - . | zstd -10 -T0 -o /home/runner/work/LynnOS/immortalwrt-End.tar.zst
          sudo df -h

      #
      # WORKSPACE存在的文件：
      #   ├── LynnOS/
      #   ├── immortalwrt/
      #   ├── immortalwrt-End.tar.zst （ 需要上传！）
      #

      - name: 上传最终提交配置
        uses: actions/upload-artifact@main
        with:
          name: immortalwrt-End
          compression-level: 0
          path: /home/runner/work/LynnOS/immortalwrt-End.tar.zst

      - name: 配置缓存
        if: env.needBuild == 'true'
        uses: HiGarfield/cachewrtbuild@main
        with:
          ccache: true
          toolchain: true
          skip: true
          mixkey: "${{ env.TARGET }}"
          prefix: /home/runner/work/LynnOS/immortalwrt

      - name: 编译 LynnOS
        if: env.needBuild == 'true'

        id: build
        continue-on-error: true
        working-directory: ../immortalwrt
        run: |
          rm -rf /home/runner/work/LynnOS/immortalwrt-End.tar.zst &

          echo "下载所需文件"
          make download -j16

          if [ "${{ inputs.ignoreError }}" = "true" ]; then
            echo "开始编译（忽略错误）"
            IGNORE_ERRORS=1 make -i -j$(($(nproc) + 1))
          else
            echo "开始编译"
            make -j$(($(nproc) + 1))
          fi

      - name: 详细输出编译
        if: steps.build.outcome == 'failure'
        working-directory: ../immortalwrt
        run: |
          if ["${{ inputs.ignoreError }}" = "true"]; then
            echo "开始详细输出编译（忽略错误）"
            IGNORE_ERRORS=1 make -i -j1 V=sc
          else
            echo "开始详细输出编译"
            make -j1 V=sc
          fi

      - name: 编译完成，准备上传
        if: steps.build.outcome == 'success'
        working-directory: ../immortalwrt/bin/targets/rockchip/armv8/
        run: |
          #当前目录：../immortalwrt/bin/targets/rockchip/armv8/
          tar -cf - ./packages --remove-files | zstd -10 -T0 -o ./packages.tar.zst
          cd .. 

          #当前目录：../immortalwrt/bin/targets/rockchip/
          tar -cf - ./armv8 | zstd -10 -T0 -o ./output.tar.zst
          cp -rf ./output.tar.zst ./armv8

          echo "CURRENT_TIME=$(date +"%Y%m%d%H%M%S")" >> $GITHUB_ENV

          df -h

      #
      # WORKSPACE存在的文件：
      #   ├── LynnOS/
      #   ├── immortalwrt/
      #   ├── immortalwrt/bin/targets/rockchip/armv8/packages.tar.zst （ 需要上传！）
      #   ├── immortalwrt/bin/targets/rockchip/armv8/output.tar.zst （ 需要上传！）
      #

      - name: 上传至 artifact
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@main
        with:
          name: output.zip
          compression-level: 0
          path: |
            /home/runner/work/LynnOS/immortalwrt/bin/targets/rockchip/armv8/output.tar.zst

      - name: 创建发行版
        if: steps.build.outcome == 'success' && inputs.ignoreError == false
        continue-on-error: true
        uses: ncipollo/release-action@main
        with:
          name: LynnOS-${{ env.TARGET }}-${{ env.CURRENT_TIME }}
          allowUpdates: true
          replacesArtifacts: true
          artifactErrorsFailBuild: false
          commit: main
          tag: "${{ env.TARGET }}-${{ env.CURRENT_TIME }}"
          body: "${{ env.CURRENT_TIME }} 自动发布 LynnOS-${{ env.TARGET }}"
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: /home/runner/work/LynnOS/immortalwrt/bin/targets/rockchip/armv8/*

  Clean:
    if: ${{ always() }}
    needs: Build
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: igorjs/gh-actions-clean-workflow@v6
        with:
          runs_older_than: 0
          runs_to_keep: 7
