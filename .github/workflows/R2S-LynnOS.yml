name: R2S-LynnOS

on:
  # schedule:
  #   - cron: 00 17 * * 5 # 星期六早上 1:00 (UTC+8)
  # push:
  #   branches:
  #     - "v3"
  #   paths:
  #     - "script/**"
  #     - ".github/workflows/**"
  workflow_dispatch:
    inputs:
      branch:
        description: "分支"
        default: "master"
        type: string
        required: true
      build:
        description: "进行编译"
        default: true
        type: boolean
        required: true
      buildtoolchain:
        description: "更新打包工具链"
        default: false
        type: boolean
        required: false
      usetoolchain:
        description: "使用预编译工具链"
        default: true
        type: boolean
        required: false

jobs:
  Build:
    runs-on: "ubuntu-24.04"

    env:
      board: R2S
      branch: "master"
      needBuild: false
      wrtdir: "null"
      workdir: "null"
      CURRENT_TIME: "null"
      TOOLCHAIN_ARTIFACT: "null"
      TERM: xterm
      DEBIAN_FRONTEND: noninteractive # 无交互

    steps:
      - name: 环境变量
        run: |
          echo "当前目录：${PWD}" # 预期 /home/runner/work/LynnOS/LynnOS

          echo "设置 workdir"
          export workdir="$(dirname "${PWD}")" && echo "workdir=${workdir}">> $GITHUB_ENV
          echo "workdir: ${workdir}"

          if [ "${{ inputs.build }}" = "true" ] || [ "${{ github.event.schedule }}" ]; then
            echo "needBuild=true" >> $GITHUB_ENV
          fi
          if [ -n "${{ inputs.branch }}" ]; then
            echo "branch=${{ inputs.branch }}" >> $GITHUB_ENV  # ${branch} 被设置
          fi
          
      - if: env.needBuild == 'true'
        name: 准备储存空间
        uses: easimon/maximize-build-space@master
        with:
          swap-size-mb: 1
          temp-reserve-mb: 512
          root-reserve-mb: 4608
          build-mount-path: "${{ env.workdir }}"
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          remove-docker-images: "true"
      
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 准备环境
        run: |          
          bash ./scripts/00_env.sh  # 不应使用sudo。${tmpdir}、${wrtdir}、${lynndir}、${linux_version} 会被设置

      - name: 运行自定义脚本
        run: |
          echo "进入wrt根目录：${wrtdir}"
          cd ${wrtdir}

          echo "运行目标平台脚本"
          bash ${lynndir}/scripts/10_${{ env.board }}.sh
          
          echo "运行官方脚本"
          mv -f ${lynndir}/scripts/tools/* ${wrtdir}/
          echo "remove_upx.sh" && bash remove_upx.sh
          echo "create_acl_for_luci.sh" && bash create_acl_for_luci.sh -a
          echo "fix_permissions.sh" && bash ./fix_permissions.sh > /dev/null
          wait

          # 更新或使用工具链
          if [ "${{ inputs.buildtoolchain }}" = "true" ]; then
            echo "构建本地 toolchain"
            make toolchain/compile CONFIG_MAKE_TOOLCHAIN=y -j$(( $(nproc) + 1 )) || true

            latest_toolchain="$(find "${wrtdir}/bin" -type f -name "*-toolchain-*.tar.zst" -printf "%T@ %p\n" 2>/dev/null | sort -nr | head -n1 | cut -d' ' -f2-)"
            if [ -n "${latest_toolchain}" ] && [ -f "${latest_toolchain}" ]; then
              echo "TOOLCHAIN_ARTIFACT=${latest_toolchain}" >> "$GITHUB_ENV"
              echo "CURRENT_TIME=$(date +%Y%m%d%H%M%S)" >> "$GITHUB_ENV"
              echo "找到 toolchain: ${latest_toolchain}"
            else
              echo "未找到 toolchain 产物" >&2
            fi
          fi

          if [ "${{ inputs.usetoolchain }}" = "true" ]; then
            echo "尝试从 releases 下载预编译 toolchain（tag: toolchain）"
            API_URL="https://api.github.com/repos/${{ github.repository }}/releases/tags/toolchain"
            AUTH_HEADER="Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}"

            # 解析获取第一个匹配的下载链接
            toolchain_url="$(curl -fsSL -H "$AUTH_HEADER" "$API_URL" \
              | grep -oE '"browser_download_url":[[:space:]]*"[^"]*toolchain[^"]*\.tar\.zst"' \
              | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')"

            if [ -n "$toolchain_url" ]; then
              echo "找到 toolchain: $toolchain_url"
              tmpfile="$(mktemp -t toolchain.XXXXXX.tar.zst)"
              curl -fL --retry 3 --retry-delay 2 -H "$AUTH_HEADER" -o "$tmpfile" "$toolchain_url"

              echo "toolchain 解压到: $TOOLCHAIN_TARGET_DIR"
              TOOLCHAIN_TARGET_DIR="${wrtdir}/external-toolchain"
              mkdir -p "$TOOLCHAIN_TARGET_DIR"
              tar -I zstd -xf "$tmpfile" -C "$TOOLCHAIN_TARGET_DIR" --strip-components=1
              
              echo "添加配置到 .config"
              echo "
              CONFIG_TOOLCHAINOPTS=n
              CONFIG_EXTERNAL_GCC_VERSION=""
              CONFIG_EXTERNAL_TOOLCHAIN=y
              CONFIG_EXTERNAL_TOOLCHAIN_LIBC_USE_MUSL=y
              CONFIG_GCC_VERSION=""
              CONFIG_LIBATOMIC_FILE_SPEC="./lib/libatomic.so.*"
              CONFIG_LIBATOMIC_ROOT_DIR="/opt/cross/aarch64-unknown-linux-gnu"
              CONFIG_LIBC_FILE_SPEC="./lib/ld{*.so*,-linux*.so.*} ./lib/lib{anl,c,cidn,crypt,dl,m,nsl,nss_dns,nss_files,resolv,util}{-*.so,.so.*,.so}"
              CONFIG_LIBC_ROOT_DIR="/opt/cross/aarch64-unknown-linux-gnu"
              CONFIG_LIBGCC_FILE_SPEC="./lib/libgcc_s.so.*"
              CONFIG_LIBGCC_ROOT_DIR="/opt/cross/aarch64-unknown-linux-gnu"
              CONFIG_LIBPTHREAD_FILE_SPEC="./lib/libpthread{-*.so,.so.*}"
              CONFIG_LIBPTHREAD_ROOT_DIR="/opt/cross/aarch64-unknown-linux-gnu"
              CONFIG_LIBRT_FILE_SPEC="./lib/librt{-*.so,.so.*}"
              CONFIG_LIBRT_ROOT_DIR="/opt/cross/aarch64-unknown-linux-gnu"
              CONFIG_LIBSTDCPP_FILE_SPEC="./lib/libstdc++.so.*"
              CONFIG_LIBSTDCPP_ROOT_DIR="/opt/cross/aarch64-unknown-linux-gnu"
              CONFIG_TARGET_NAME="aarch64-unknown-linux-gnu"
              CONFIG_TOOLCHAIN_BIN_PATH="./usr/bin ./bin"
              CONFIG_TOOLCHAIN_INC_PATH="./usr/include ./include/fortify ./include"
              CONFIG_TOOLCHAIN_LIBC="musl"
              CONFIG_TOOLCHAIN_LIB_PATH="./usr/lib ./lib"
              CONFIG_TOOLCHAIN_PREFIX="aarch64-unknown-linux-gnu"
              CONFIG_TOOLCHAIN_ROOT="/opt/cross/aarch64-unknown-linux-gnu"
              CONFIG_USE_EXTERNAL_LIBC=y
              " >> "${wrtdir}/.config"

              echo "预编译 toolchain 配置完成"
              rm -f "$tmpfile"
            else
              echo "未找到预编译工具链，跳过下载"
            fi
          fi

          echo "生成完整配置"
          make defconfig -j$(($(nproc) + 1))

          echo "压缩最终提交配置"
          cd ${workdir} && tar -cf immortalwrt-End.tar -C "$(dirname "${wrtdir}")" "$(basename "${wrtdir}")"
          sudo df -h

      - if: inputs.buildtoolchain && env.TOOLCHAIN_ARTIFACT
        name: 上传 toolchain
        continue-on-error: true
        uses: ncipollo/release-action@main
        with:
          allowUpdates: true
          replacesArtifacts: true
          artifactErrorsFailBuild: false
          commit: main
          tag: "toolchain"
          body: "${{ env.CURRENT_TIME }} 自动发布 toolchain"
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: "${{ env.TOOLCHAIN_ARTIFACT }}"

      - name: 上传最终提交配置
        uses: actions/upload-artifact@main
        with:
          name: immortalwrt-End.tar
          compression-level: 6
          path: "${{ env.workdir }}/immortalwrt-End.tar"

      - if: env.needBuild == 'true'
        name: 配置缓存
        uses: stupidloud/cachewrtbuild@main
        with:
          ccache: true
          toolchain: true
          skip: true
          mixkey: "${{ env.board }}"
          prefix: "${{ env.wrtdir }}"

      - if: env.needBuild == 'true'
        name: 编译 LynnOS
        id: build
        continue-on-error: true
        shell: bash
        run: |
          echo "进入wrt根目录：${wrtdir}"
          cd ${wrtdir}

          echo "删除打包文件"
          rm -rf ${workdir}/immortalwrt-End.tar &

          echo "下载所需文件"
          make download -j16

          echo "开始编译"
          make -j$(($(nproc) + 1)) -S
          
      - if: steps.build.outcome == 'failure'
        name: 详细输出编译
        run: |
          echo "进入wrt根目录：${wrtdir}"
          cd ${wrtdir}
          
          echo "开始详细输出编译"
          make -j1 V=sc

      - if: steps.build.outcome == 'success'
        name: 编译完成，准备上传
        run: |
          echo "进入产物目录"
          cd ${wrtdir}/bin/targets/rockchip/armv8/

          echo "压缩产物 packages"
          tar -cf - ./packages --remove-files | zstd -16 -T0 -o ./packages.tar.zst
          echo "${wrtdir}/bin/targets/rockchip/armv8/packages.tar.zst"

          echo "压缩产物文件夹"
          tar -cf - . | zstd -16 -T0 -o ../output.tar.zst && mv -f ../output.tar.zst ./
          echo "${wrtdir}/bin/targets/rockchip/armv8/output.tar.zst"

          echo "CURRENT_TIME=$(date +"%Y%m%d%H%M%S")" >> $GITHUB_ENV
          sudo df -h

      - if: steps.build.outcome == 'success'
        name: 创建发行版
        continue-on-error: true
        uses: ncipollo/release-action@main
        with:
          name: LynnOS-${{ env.board }}-${{ env.CURRENT_TIME }}
          allowUpdates: true
          replacesArtifacts: true
          artifactErrorsFailBuild: false
          commit: main
          tag: "${{ env.board }}-${{ env.CURRENT_TIME }}"
          body: "${{ env.CURRENT_TIME }} 自动发布 LynnOS-${{ env.board }}"
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: "${{ env.wrtdir }}/bin/targets/rockchip/armv8/*"

  Clean:
    if: ${{ always() }}
    needs: Build
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: igorjs/gh-actions-clean-workflow@v6
        with:
          runs_older_than: 0
          runs_to_keep: 15
