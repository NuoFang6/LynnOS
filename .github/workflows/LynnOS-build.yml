name: LynnOS-build

on:
  workflow_dispatch:
    inputs:
      target:
        description: "选择编译目标"
        default: "r2s"
        type: choice
        required: true
        options:
          - r2s
      build:
        description: "编译固件"
        default: true
        type: boolean
        required: true
      fastbuild:
        description: "验证模式（快速编译）" # TODO
        default: false
        type: boolean
        required: false
      needssh:
        description: "需要 SSH 连接调试"
        default: false
        type: boolean
        required: false

defaults:
  run:
    shell: bash

jobs:
  Build:
    runs-on: "ubuntu-24.04"

    env:
      DEBIAN_FRONTEND: noninteractive # 无交互
      immortalwrt_branch: "master" # TODO: 以后改成输入参数
      workdir_out: ""
      target: ""

    steps:
      - if: github.event.inputs.build == 'true' && github.event.inputs.fastbuild == 'false'
        name: 准备可用空间
        uses: AdityaGarg8/remove-unwanted-software@v5
        with:
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          remove-docker-images: "true"
          remove-large-packages: "true"
          remove-cached-tools: "true"
          remove-swapfile: "true"

      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 准备容器 （init-out.sh）
        run: bash prepare/init-out.sh

      - name: 接收环境变量
        run: |
          d '
            . set_env target "${{ github.event.inputs.target }}"
            . set_env fastbuild "${{ github.event.inputs.fastbuild }}"

            . set_env immortalwrt_branch "${{ env.immortalwrt_branch }}"

            . set_env targetdir "${lynndir}/target/${target}"
          '

      - name: 准备环境 （init-in.sh）
        run: d "cd ${lynndir} && bash prepare/init-in.sh"

      - name: 准备编译目标设备 （prepare.sh）
        run: |
          d "
            cd ${wrtdir}
            bash ${lynndir}/target/${target}/prepare.sh
            p "追加配置"
            cat .config_pending | tee -a .config
            p "生成最终配置"
            make defconfig -j$(($(nproc) + 1))
          "

      - name: 压缩编译目录
        run: |
          d '
            cd ${workdir}
            cp -r ${lynndir} ${wrtdir}/
            tar -cf - $(basename ${wrtdir})/ | zstd -16 -T0 --auto-threads=logical > wrt_end.tar.zst # 最性价比-3 适度压缩-16 最大--ultra -22
            rm -rf ${wrtdir}/$(basename ${lynndir})
          '

      - name: 上传编译目录
        uses: actions/upload-artifact@main
        with:
          name: wrt_end.tar.zst
          path: "${{ env.workdir_out }}/wrt_end.tar.zst"
          compression-level: 0

      - if: github.event.inputs.build == 'true'
        name: 开始编译：${{ env.target }}
        run: |
          d '
            cd ${wrtdir}
            p "开始编译"
            make download -j$(($(nproc) + 1))
            make -j$(($(nproc) + 1))
            if [ $? -ne 0 ]; then
              p "！！编译失败，进行单线程详细日志编译"
              make V=s -j1
              if [ $? -ne 0 ]; then
                p "！！单线程编译依然失败，结束"
                exit 1
              else
                p "单线程编译成功"
                . set_env build_success "true"
              fi
            else
              p "编译成功"
              . set_env build_success "true"
            fi

            p "打包所有产物"
            tar -cf - bin/ | zstd -16 -T0 --auto-threads=logical > "${workdir_out}/bin_${target}.tar.zst"
            p "打包软件包"
            tar -C bin/ -cf - packages/ | zstd -16 -T0 --auto-threads=logical > "${workdir_out}/packages_${target}.tar.zst"

          '
          
      - if: github.event.inputs.build == 'true'
        name: 上传产物文件夹
        uses: actions/upload-artifact@main
        with:
          name: firmware
          path: "${{ env.workdir_out }}/bin_${{ env.target }}.tar.zst"
          compression-level: 0
          if-no-files-found: error

      - if: github.event.inputs.needssh == 'true'
        name: SSH 临时调试
        uses: mxschmitt/action-tmate@v3
        timeout-minutes: 240
